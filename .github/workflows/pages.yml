name: Test and deploy RockyFit web

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rockyfit-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify date rotation
        run: npm test
      - name: Check static assets
        run: |
          test -s docs/index.html
          test -s docs/app.js
          test -s docs/plan.js
          test -s docs/sw.js
          test -s docs/manifest.webmanifest
          test -s docs/apple-touch-icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
